[project]
name = "proofrepair"
version = "0.0.1"
description = "Diffusion / EBM proof repair on Lean 4"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
]

[project.scripts]
proofrepair = "proofrepair.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofrepair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
